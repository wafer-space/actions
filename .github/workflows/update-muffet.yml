# Update muffet
# pr-preview/scripts/install-verification-tools.sh installs muffet at a
# pinned version with a SHA256 checksum. This workflow checks weekly for a
# muffet release that is newer and at least a week old, and opens (or
# updates) a pull request that updates both.
#
# update-muffet.py verifies the release against muffet's published
# checksums. It doesn't run the new binary: CI does, on the pull request.
#
# The branch and pull request are created with a GitHub App token rather
# than GITHUB_TOKEN, because GitHub doesn't start workflows for events
# GITHUB_TOKEN causes, so the pull request would get no CI. The token is
# only created once there's an update, and never stored in .git/config.
# It needs:
# - variable AUTOMATION_APP_CLIENT_ID: the App's client ID
# - secret AUTOMATION_APP_PRIVATE_KEY: a private key for the App
# The App needs Contents and Pull requests (read and write) permissions,
# and to be installed on this repository.

name: Update muffet

on:
  schedule:
    - cron: '17 6 * * 1'  # Mondays 06:17 UTC
  workflow_dispatch:

# GITHUB_TOKEN only reads; writes use the App token
permissions:
  contents: read

concurrency:
  group: update-muffet
  cancel-in-progress: false

jobs:
  update-muffet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Check for a newer muffet release
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/update-muffet.py pr-preview/scripts/install-verification-tools.sh

      - name: Create GitHub App token
        id: app-token
        if: steps.update.outputs.updated == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update pull request
        if: steps.update.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          VERSION: ${{ steps.update.outputs.version }}
          PREVIOUS_VERSION: ${{ steps.update.outputs.previous_version }}
          RELEASE_URL: ${{ steps.update.outputs.release_url }}
        run: |
          # One branch, so a newer release replaces an unmerged update
          # instead of opening a second pull request
          BRANCH="automation/update-muffet"

          # Commit as the App's bot user, so the commits link to it
          BOT_USER="${APP_SLUG}[bot]"
          BOT_ID=$(gh api "users/${BOT_USER}" --jq .id)
          git config user.name "$BOT_USER"
          git config user.email "${BOT_ID}+${BOT_USER}@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -am "CI: update muffet from ${PREVIOUS_VERSION} to ${VERSION}"
          # git uses GH_TOKEN through gh's credential helper
          gh auth setup-git
          git push --force origin "$BRANCH"

          cat > pr-body.md << EOF
          Updates the muffet link checker used by the \`pr-preview/verify\` action from ${PREVIOUS_VERSION} to ${VERSION}.

          Release notes: ${RELEASE_URL}

          \`update-muffet.py\` checked that \`muffet_linux_amd64.tar.gz\` matches the SHA256 in the release's published checksums file. CI's muffet job runs the new version on the test site.

          Opened automatically by \`.github/workflows/update-muffet.yml\`.
          EOF

          TITLE="CI: update muffet to ${VERSION}"
          PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$PR" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$PR" -f title="$TITLE" -F body=@pr-body.md
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file pr-body.md
          fi
