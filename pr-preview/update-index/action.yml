name: PR preview / update index
description: >-
  Regenerates index.html, the list of previews, in a checkout of the
  preview repository. The deploy action does this itself; this is for
  workflows that remove previews.

inputs:
  path:
    description: The checkout of the preview repository.
    required: true
  preview-base-url:
    description: URL previews are served under, e.g. https://preview.wafer.space.
    required: true

runs:
  using: composite
  steps:
    - name: Generate preview index
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        PREVIEW_BASE_URL: ${{ inputs.preview-base-url }}
      run: '"$GITHUB_ACTION_PATH/../scripts/generate-preview-index.sh"'
