name: PR preview / check for executable changes
description: >-
  Stage 1 (pull_request). Warns early when a fork PR changes _plugins/ or
  .github/, which means find-pr will refuse to build its preview.
  Informational only: find-pr checks again for itself.

inputs:
  github-token:
    description: Token that can read the pull request's files.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Check for executable code changes
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
      env:
        SCRIPTS: ${{ github.action_path }}/../scripts
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const check = require(`${process.env.SCRIPTS}/check-pr-executable-changes.js`);
          await check(github, context, core);
