name: PR preview / comment
description: >-
  Comments on the pull request about its preview: deployed, failed or
  blocked.

inputs:
  kind:
    description: deployed, failed or blocked.
    required: true
  pr-number:
    required: true
  preview-url:
    description: For deployed.
    default: ''
  head-sha:
    description: For deployed.
    default: ''
  is-fork:
    description: For deployed.
    default: 'false'
  gemfile-modified:
    description: For deployed.
    default: 'false'
  error-message:
    description: For failed.
    default: ''
  dangerous-files:
    description: For blocked, one per line.
    default: ''
  github-token:
    description: Token that can comment on pull requests.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Comment on pull request
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
      env:
        SCRIPTS: ${{ github.action_path }}/../scripts
        KIND: ${{ inputs.kind }}
        PR_NUMBER: ${{ inputs.pr-number }}
        PREVIEW_URL: ${{ inputs.preview-url }}
        HEAD_SHA: ${{ inputs.head-sha }}
        IS_FORK: ${{ inputs.is-fork }}
        GEMFILE_MODIFIED: ${{ inputs.gemfile-modified }}
        ERROR_MESSAGE: ${{ inputs.error-message }}
        DANGEROUS_FILES: ${{ inputs.dangerous-files }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const comments = require(`${process.env.SCRIPTS}/comment-preview-status.js`);
          const kind = process.env.KIND;
          if (!['deployed', 'failed', 'blocked'].includes(kind)) {
            throw new Error(`Unknown kind: ${kind}`);
          }
          await comments[kind](github, context);
