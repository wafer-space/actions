name: PR preview / build
description: >-
  Stage 2 (workflow_run). Builds the pull request's site with the theme
  from fetch-theme and uploads it as an artifact for the deploy action.
  This is the only action that runs the pull request's content, so the job
  using it should get no secrets and only read permissions. For fork PRs it
  first puts back the trusted _plugins/ and Gemfile from the default branch.

inputs:
  pr-sha:
    description: The pull request's head commit (find-pr's sha).
    required: true
  is-fork:
    description: "'true' for a fork pull request (find-pr's is-fork)."
    required: true
  baseurl:
    description: Jekyll's --baseurl (find-pr's baseurl-path).
    required: true
  theme-artifact:
    description: Name of fetch-theme's artifact.
    default: preview-theme
  site-artifact:
    description: Name of the artifact to upload the built site as.
    default: preview-site
  trusted-ref:
    description: Branch the trusted _plugins/ and Gemfile come from.
    default: ${{ github.event.repository.default_branch }}
  ruby-version:
    default: '3.1'

runs:
  using: composite
  steps:
    - name: Check inputs
      shell: bash
      env:
        PR_SHA: ${{ inputs.pr-sha }}
        BASEURL: ${{ inputs.baseurl }}
      run: |
        if ! [[ "$PR_SHA" =~ ^[0-9a-f]{40}$ ]]; then
          echo "Invalid pr-sha: $PR_SHA" >&2
          exit 1
        fi
        if ! [[ "$BASEURL" =~ ^(/[A-Za-z0-9._-]+)+$ ]]; then
          echo "Invalid baseurl: $BASEURL" >&2
          exit 1
        fi

    - name: Checkout pull request
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      with:
        ref: ${{ inputs.pr-sha }}
        path: pr
        submodules: false  # the theme comes from fetch-theme
        # Don't leave the token in .git/config, where the build could read it
        persist-credentials: false
        # actions/checkout refuses fork code in workflow_run unless told
        # otherwise. Building it is this action's purpose: the job has no
        # secrets, and fork PRs changing _plugins/ or .github/ are blocked by
        # find-pr
        allow-unsafe-pr-checkout: true

    - name: Checkout trusted copy of the default branch
      if: inputs.is-fork == 'true'
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      with:
        ref: ${{ inputs.trusted-ref }}
        path: trusted-main
        persist-credentials: false

    - name: Add theme
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
      with:
        name: ${{ inputs.theme-artifact }}
        path: pr/_theme

    - name: Apply security overrides for fork PRs
      if: inputs.is-fork == 'true'
      shell: bash
      working-directory: pr
      run: '"$GITHUB_ACTION_PATH/../scripts/apply-fork-overrides.sh" "$GITHUB_WORKSPACE/trusted-main"'

    - name: Setup Ruby
      uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4  # v1.207.0
      with:
        ruby-version: ${{ inputs.ruby-version }}
        working-directory: pr
        # No gem cache: this runs pull request code in the default branch's
        # cache scope, so it must neither restore nor save one
        bundler-cache: false

    - name: Build site
      shell: bash
      working-directory: pr
      env:
        BASEURL: ${{ inputs.baseurl }}
        JEKYLL_ENV: production
      run: '"$GITHUB_ACTION_PATH/../scripts/build-preview-site.sh"'

    - name: Upload site
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
      with:
        name: ${{ inputs.site-artifact }}
        path: pr/_site
        if-no-files-found: error
        retention-days: 1
