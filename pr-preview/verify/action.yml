name: PR preview / verify
description: >-
  Checks a deployed preview (content, assets, links with muffet, load
  time, viewport) and posts the report on the pull request. Fails if any
  check fails.

inputs:
  pr-number:
    required: true
  preview-url:
    description: The preview to check, e.g. https://preview.wafer.space/pr-12/.
    required: true
  head-sha:
    description: "Commit the preview should be built from (default: the pull request's head)."
    default: ''
  github-token:
    description: Token that can read and comment on pull requests.
    default: ${{ github.token }}

outputs:
  verification-status:
    description: success or failed.
    value: ${{ steps.verification.outputs.verification_status }}

runs:
  using: composite
  steps:
    - name: Get PR information
      id: pr-info
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
      env:
        SCRIPTS: ${{ github.action_path }}/../scripts
        INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        INPUT_PREVIEW_URL: ${{ inputs.preview-url }}
        INPUT_HEAD_SHA: ${{ inputs.head-sha }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const getVerificationPrInfo = require(`${process.env.SCRIPTS}/get-verification-pr-info.js`);
          await getVerificationPrInfo(github, context, core);

    - name: Wait for preview deployment to complete
      shell: bash
      env:
        PREVIEW_URL: ${{ steps.pr-info.outputs.preview_url }}
        EXPECTED_COMMIT: ${{ steps.pr-info.outputs.head_sha }}
      run: '"$GITHUB_ACTION_PATH/../scripts/wait-for-preview-commit.sh"'

    - name: Install verification tools
      shell: bash
      run: '"$GITHUB_ACTION_PATH/../scripts/install-verification-tools.sh"'

    - name: Perform comprehensive site verification
      id: verification
      shell: bash
      env:
        PREVIEW_URL: ${{ steps.pr-info.outputs.preview_url }}
        PR_NUMBER: ${{ steps.pr-info.outputs.pr_number }}
      run: '"$GITHUB_ACTION_PATH/../scripts/run-verification.sh"'

    - name: Comment verification results on PR
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
      env:
        SCRIPTS: ${{ github.action_path }}/../scripts
        VERIFICATION_STATUS: ${{ steps.verification.outputs.verification_status }}
        REPORT_CONTENT: ${{ steps.verification.outputs.report_content }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        PR_NUMBER: ${{ steps.pr-info.outputs.pr_number }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const commentVerificationResults = require(`${process.env.SCRIPTS}/comment-verification-results.js`);
          const result = await commentVerificationResults(github, context, core);
          console.log(`Posted verification results to PR #${process.env.PR_NUMBER}`);
          console.log(`Comment ID: ${result.commentId}, Archived: ${result.archivedCount} previous comments`);

    - name: Fail if verification failed
      if: steps.verification.outputs.verification_status == 'failed'
      shell: bash
      run: |
        echo "Preview site verification failed!"
        echo "Check the verification report in the PR comment for details."
        exit 1
